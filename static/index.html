<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate & Gram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #BCE0FF;
    --blush: #FFC6DF;
    --lilac: #E3D7FF;
    --ink: #1E2A47;
    --ink-soft: #5B6788;
    --blue: #5AA9F5;
    --pink: #F58FBE;
    --glass: rgba(255, 255, 255, 0.42);
    --glass-strong: rgba(255, 255, 255, 0.62);
    --glass-edge: rgba(255, 255, 255, 0.75);
    --shadow: 0 18px 50px rgba(110, 130, 190, 0.22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(60vmax 50vmax at 8% 6%, var(--sky) 0%, transparent 60%),
      radial-gradient(55vmax 50vmax at 95% 12%, var(--blush) 0%, transparent 62%),
      radial-gradient(60vmax 55vmax at 70% 100%, var(--lilac) 0%, transparent 65%),
      radial-gradient(50vmax 45vmax at 0% 95%, #CDEBFF 0%, transparent 60%),
      #F4F7FF;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 56px 20px 96px;
  }
  main { width: 100%; max-width: 560px; }

  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-edge);
    border-radius: 28px;
    box-shadow:
      var(--shadow),
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -1px 0 rgba(255, 255, 255, 0.25);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgba(255, 255, 255, 0.8); }
  }

  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px 8px 10px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 28px;
  }
  .wordmark i {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--pink));
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.7);
  }

  h1 {
    font-size: clamp(34px, 8vw, 44px);
    line-height: 1.08;
    letter-spacing: -0.03em;
    font-weight: 700;
    margin: 0 0 14px;
    max-width: 14ch;
  }
  .subhead {
    color: var(--ink-soft);
    font-size: 17px;
    line-height: 1.5;
    max-width: 40ch;
    margin: 0 0 32px;
  }

  .platform {
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  }
  .platform:hover, .platform.drag, .platform:focus-visible {
    background: var(--glass-strong);
    transform: translateY(-2px);
    outline: none;
  }
  .platform:focus-visible { box-shadow: var(--shadow), 0 0 0 3px rgba(90,169,245,0.55); }
  .icon-orb {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(255,255,255,0.35));
    border: 1px solid var(--glass-edge);
    box-shadow: 0 8px 22px rgba(120,140,200,0.25), inset 0 1px 0 #fff;
  }
  .icon-orb svg { width: 28px; height: 28px; color: var(--blue); }
  .platform-text { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .platform-hint { font-size: 14px; color: var(--ink-soft); margin: 0; }
  #fileInput { display: none; }

  .preview-row {
    display: none;
    align-items: center;
    gap: 14px;
    margin-top: 16px;
    padding: 10px 16px 10px 10px;
    border-radius: 20px;
  }
  .preview-row img { width: 56px; height: 56px; object-fit: cover; border-radius: 14px; border: 1px solid var(--glass-edge); }
  .preview-name { font-size: 14px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .status {
    margin-top: 16px;
    padding: 14px 20px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 500;
    display: none;
    align-items: center;
    gap: 12px;
  }
  .status.visible { display: flex; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2.5px solid rgba(90,169,245,0.25);
    border-top-color: var(--pink);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    margin-top: 16px;
    padding: 14px 20px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
    background: rgba(255, 214, 228, 0.6);
    border-color: rgba(245, 143, 190, 0.6);
    overflow-wrap: anywhere;
  }
  .error-box.visible { display: block; }

  .ticket { margin-top: 20px; padding: 28px 24px 24px; display: none; }
  .ticket.visible { display: block; animation: rise 0.5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .item-row { margin-bottom: 20px; }
  .item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .item-name { font-size: 16px; font-weight: 500; text-transform: capitalize; }
  .item-figures { font-size: 14px; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .item-figures b { color: var(--ink); font-weight: 600; }
  .meter {
    height: 8px; margin-top: 10px; border-radius: 999px; overflow: hidden;
    background: rgba(255,255,255,0.55);
    box-shadow: inset 0 1px 2px rgba(110,130,190,0.2);
  }
  .meter-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--pink));
  }
  .not-found { color: #C04578; font-size: 13px; margin: 6px 0 0; }

  .total-row {
    margin-top: 8px;
    padding: 20px 22px;
    border-radius: 22px;
    background: var(--glass-strong);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 #fff;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .total-label { font-size: 16px; font-weight: 500; color: var(--ink-soft); }
  .total-value {
    font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(120deg, var(--blue), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .total-value span { font-size: 20px; font-weight: 600; letter-spacing: 0; }

  .confidence-note { margin: 16px 2px 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }

  .rescan {
    margin-top: 20px;
    padding: 12px 22px;
    border-radius: 999px;
    font: inherit; font-size: 15px; font-weight: 600; color: var(--ink);
    cursor: pointer;
    display: none;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .rescan.visible { display: inline-block; }
  .rescan:hover { background: var(--glass-strong); }
  .rescan:active { transform: scale(0.98); }
  .rescan:focus-visible { outline: 3px solid rgba(90,169,245,0.55); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <div class="wordmark glass"><i></i>Plate & Gram</div>
  <h1>How much protein is on your plate?</h1>
  <p class="subhead">Take or upload a photo of a meal. The scanner identifies each item, estimates its weight, and totals the protein.</p>

  <div class="platform glass" id="platform" role="button" tabindex="0" aria-label="Choose a photo of your plate">
    <div class="icon-orb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </div>
    <p class="platform-text">Add a photo of your plate</p>
    <p class="platform-hint">Drop it here or tap to choose. JPEG, PNG, or WEBP.</p>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
  </div>

  <div class="preview-row glass" id="previewRow">
    <img id="previewImg" alt="Plate preview">
    <span class="preview-name" id="previewName"></span>
  </div>

  <div class="status glass" id="status"><div class="spinner"></div><span>Analyzing your plate</span></div>
  <div class="error-box glass" id="errorBox" role="alert"></div>

  <div class="ticket glass" id="ticket">
    <div id="itemList"></div>
    <div class="total-row">
      <span class="total-label">Total protein</span>
      <span class="total-value" id="totalValue">0<span> g</span></span>
    </div>
    <p class="confidence-note" id="confidenceNote"></p>
  </div>

  <button class="rescan glass" id="rescanBtn">Scan another plate</button>
</main>

<script>
const platform = document.getElementById('platform');
const fileInput = document.getElementById('fileInput');
const previewRow = document.getElementById('previewRow');
const previewImg = document.getElementById('previewImg');
const previewName = document.getElementById('previewName');
const statusEl = document.getElementById('status');
const errorBox = document.getElementById('errorBox');
const ticket = document.getElementById('ticket');
const itemList = document.getElementById('itemList');
const totalValue = document.getElementById('totalValue');
const confidenceNote = document.getElementById('confidenceNote');
const rescanBtn = document.getElementById('rescanBtn');

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

platform.addEventListener('click', () => fileInput.click());
platform.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
});
['dragenter', 'dragover'].forEach(evt =>
  platform.addEventListener(evt, e => { e.preventDefault(); platform.classList.add('drag'); })
);
['dragleave', 'drop'].forEach(evt =>
  platform.addEventListener(evt, e => { e.preventDefault(); platform.classList.remove('drag'); })
);
platform.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});
rescanBtn.addEventListener('click', reset);

function reset() {
  ticket.classList.remove('visible');
  errorBox.classList.remove('visible');
  previewRow.style.display = 'none';
  rescanBtn.classList.remove('visible');
  fileInput.value = '';
}

async function handleFile(file) {
  reset();
  previewImg.src = URL.createObjectURL(file);
  previewName.textContent = file.name;
  previewRow.style.display = 'flex';
  statusEl.classList.add('visible');

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/analyze', { method: 'POST', body: formData });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    statusEl.classList.remove('visible');

    if (!res.ok) {
      showError(data.detail || 'The server could not read that photo. Try a clearer, well-lit shot of the plate.');
      return;
    }
    renderResults(data);
  } catch (err) {
    statusEl.classList.remove('visible');
    showError('Could not reach the server. Check that the backend is running and try again.');
  }
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('visible');
  rescanBtn.classList.add('visible');
}

function renderResults(data) {
  itemList.innerHTML = '';
  const maxProtein = Math.max(...data.items.map(i => i.protein_g || 0), 0.01);

  data.items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item-row';
    const protein = item.found_in_database ? `<b>${item.protein_g} g</b> protein` : `<b>n/a</b> protein`;

    row.innerHTML = `
      <div class="item-top">
        <span class="item-name">${esc(item.name)}</span>
        <span class="item-figures">${Math.round(item.grams)} g, ${protein}</span>
      </div>
      <div class="meter"><div class="meter-fill" style="width:${((item.protein_g || 0) / maxProtein) * 100}%"></div></div>
      ${!item.found_in_database ? '<p class="not-found">Not found in the nutrition database, so it is left out of the total.</p>' : ''}
    `;
    itemList.appendChild(row);
  });

  totalValue.innerHTML = `${data.total_protein_g}<span> g</span>`;
  confidenceNote.textContent = data.confidence_note || '';
  ticket.classList.add('visible');
  rescanBtn.classList.add('visible');
}
</script>
</body>
</html>
